name: Website quality and SEO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install locked dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Compile, build and validate SEO
        run: pnpm check
      - name: Validate production redirects
        run: pnpm redirect:check
